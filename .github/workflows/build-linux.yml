name: Linux derle

# Bilgisayar uygulaması (Flutter Linux hedefi). APK işinden bağımsızdır;
# biri bozulursa öteki etkilenmez.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Linux derleme araclari
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      # Sabit sürüm: yeniden üretilebilir derleme. pdfrx (PDFium) ikilisi derleme
      # sırasında indirilir; bu adım AĞ gerektirir.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: Linux iskeletini olustur
        run: |
          flutter config --enable-linux-desktop
          if [ ! -d linux ]; then
            flutter create --org com.kocum --project-name kocum --platforms linux "$RUNNER_TEMP/scaffold"
            cp -r "$RUNNER_TEMP/scaffold/linux" ./linux
          fi

      - name: Bagimliliklari indir
        run: flutter pub get

      - name: Kod uret (veritabani)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Testler
        run: flutter test

      - name: Linux derle
        run: flutter build linux --release --build-number=${{ github.run_number }}

      - name: Paketle
        run: |
          mkdir -p dist/kocum
          cp -r build/linux/x64/release/bundle/. dist/kocum/
          cp tool/linux/com.kocum.kocum.desktop dist/kocum/
          cp assets/icon/logo.png dist/kocum/com.kocum.kocum.png
          tar -czf kocum-linux-x64.tar.gz -C dist kocum

      - uses: actions/upload-artifact@v4
        with:
          name: kocum-linux
          path: kocum-linux-x64.tar.gz
